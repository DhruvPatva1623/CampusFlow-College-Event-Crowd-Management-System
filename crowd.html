<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crowd Status - CampusFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg topbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">CampusFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link active" href="crowd.html">Crowd Status</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html">Organizer</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1>Crowd Status</h1>
      <p>Crowd % = registered / capacity x 100</p>
    </div>
  </header>

  <main class="section">
    <div class="container">

      <p class="mb-4">
        <span class="status status-normal">Normal 0-70%</span>
        <span class="status status-moderate">Moderate 71-90%</span>
        <span class="status status-high">High 91-99%</span>
        <span class="status status-full">Full 100%</span>
      </p>

      <!-- cards are added by script.js -->
      <div class="row" id="crowdList"></div>
    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/events.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
