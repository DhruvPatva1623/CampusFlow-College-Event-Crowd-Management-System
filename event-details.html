<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Details - CampusFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg topbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">CampusFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="crowd.html">Crowd Status</a></li>
          <li class="nav-item"><a class="nav-link" href="admin.html">Organizer</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1 id="eventName">Event Details</h1>
      <p id="eventCategory"></p>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="row g-4">

        <!-- event information is filled in by script.js using the id in the url -->
        <div class="col-lg-6">
          <div class="form-card" id="eventDetails">Loading...</div>
        </div>

        <div class="col-lg-6">
          <div class="form-card">
            <h3 class="mb-3">Register</h3>

            <!-- later: action="php/register.php" method="POST" -->
            <form id="registerForm" action="php/register.php" method="POST">
              <input type="hidden" id="eventId" name="event_id">
              <div class="mb-3">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" class="form-control" id="fullName" name="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="enrollment">Enrollment Number</label>
                <input type="text" class="form-control" id="enrollment" name="enrollment_no" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="branch">Branch</label>
                  <select class="form-select" id="branch" name="branch" required>
                    <option value="">Select</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                  </select>
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label" for="year">Year</label>
                  <select class="form-select" id="year" name="year" required>
                    <option value="">Select</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="10 digits" required>
              </div>

              <p class="msg" id="formMessage"></p>

              <button type="submit" class="btn btn-dark-cf" id="registerBtn">Register Now</button>
              <a href="events.html" class="btn btn-line-cf">Back to Events</a>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/events.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
