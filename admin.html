<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizer - CampusFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:wght@700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg topbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">CampusFlow</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="crowd.html">Crowd Status</a></li>
          <li class="nav-item"><a class="nav-link active" href="admin.html">Organizer</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="page-head">
    <div class="container">
      <h1>Organizer</h1>
      <p>Manage events and watch the crowd</p>
    </div>
  </header>

  <main class="section">
    <div class="container">

      <!-- login: the form is checked by php/login.php (needs PHP and MySQL running) -->
      <div id="loginArea" class="login-wrap">
        <div class="form-card">
          <h3 class="mb-3">Organizer Login</h3>
          <form action="php/login.php" method="POST">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <p class="msg" id="loginMessage"></p>
            <button type="submit" class="btn btn-dark-cf w-100">Login</button>
          </form>
        </div>
      </div>

      <!-- dashboard: shown only after login -->
      <div id="dashboard" style="display: none;">

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="mb-0">Dashboard</h3>
          <a href="php/logout.php" class="btn btn-line-cf btn-sm">Logout</a>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3"><div class="count-box"><div class="num" id="totalEvents">0</div>Total events</div></div>
          <div class="col-6 col-md-3"><div class="count-box"><div class="num" id="totalRegistrations">0</div>Total registrations</div></div>
          <div class="col-6 col-md-3"><div class="count-box"><div class="num" id="highCrowd">0</div>High crowd</div></div>
          <div class="col-6 col-md-3"><div class="count-box"><div class="num" id="fullEvents">0</div>Full events</div></div>
        </div>

        <!-- changes made here are not saved in the database yet -->
        <div class="form-card mb-4">
          <h5>Add Event</h5>
          <form id="addEventForm" class="row g-2">
            <div class="col-md-3"><input type="text" class="form-control" id="newName" placeholder="Event name" required></div>
            <div class="col-md-2">
              <select class="form-select" id="newCategory">
                <option>Technical</option>
                <option>Cultural</option>
                <option>Sports</option>
                <option>Workshop</option>
              </select>
            </div>
            <div class="col-md-3"><input type="date" class="form-control" id="newDate" required></div>
            <div class="col-md-2"><input type="number" class="form-control" id="newCapacity" placeholder="Capacity" min="1" required></div>
            <div class="col-md-2"><button type="submit" class="btn btn-dark-cf w-100">Add</button></div>
          </form>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered admin-table">
            <thead>
              <tr><th>Event</th><th>Date</th><th>Capacity</th><th>Registered</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="adminRows"></tbody>
          </table>
        </div>

      </div>
    </div>
  </main>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/events.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
